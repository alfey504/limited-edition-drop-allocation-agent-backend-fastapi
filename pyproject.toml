[project]
name = "limited-edition-drop-allocation-agent-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.13.0",
    "reportlab>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = []
